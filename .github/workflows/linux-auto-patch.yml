name: Linux Auto Patch

on:
  push:
    branches: [ "main" ]

jobs:
  patch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # IMPORTANT: If your commands span multiple lines, you MUST use the | character
      - name: Run inline patch scripts
        run: |
          echo "Start Patching Activity"
          echo "----------------------------------------"
          apt list --installed
          uname -a
          cat /etc/os-release

