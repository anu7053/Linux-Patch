name: Scheduled Environment Test
on:   
  schedule:
    # Trigger 1: Every Saturday at 10 PM IST (4:30 PM UTC)
    - cron: '30 16 * * 6' 
    # Trigger 2: Every Monday at 10 AM IST (4:30 AM UTC)
    -  cron: '30 4 * * 1'
# Allows you to manuaaly click "Run Workflow" to check the logic instantly 
  workflow_dispatch: 
jobs:
  evaluate-shedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment state
        run: |
          echo "Current System Time (UTC): $(date)"
          echo "Evaluating Scheduled Task Execution..."
          
